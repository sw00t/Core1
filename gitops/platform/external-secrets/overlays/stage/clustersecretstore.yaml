# Reads core1/stage/* and core1/shared/* from OpenBao, logging in with this cluster's ServiceAccount token.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels:
    app.kubernetes.io/part-of: core1
spec:
  provider:
    vault:
      server: https://bao.mgmt.localhost:__CORE1_MGMT_HTTPS_PORT__
      path: core1
      version: v2
      caProvider: {type: Secret, name: core1-ca, namespace: cert-manager, key: tls.crt}
      auth:
        kubernetes:
          mountPath: kubernetes-stage
          role: external-secrets
          serviceAccountRef: {name: external-secrets, namespace: external-secrets}
