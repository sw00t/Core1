# Reads core1/mgmt/* and core1/shared/* from OpenBao, logging in with this cluster's ServiceAccount token.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels:
    app.kubernetes.io/part-of: core1
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: core1
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-mgmt
          role: external-secrets
          serviceAccountRef: {name: external-secrets, namespace: external-secrets}
