# Argo CD UI and API at https://argocd.mgmt.localhost:<mgmt https port>
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: core1
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: core1, namespace: gateway, sectionName: https}]
  hostnames: ["argocd.mgmt.localhost"]
  rules:
    # defaults written out so Argo CD's diff matches what the API server stores
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: argocd-server, port: 80, weight: 1}]
