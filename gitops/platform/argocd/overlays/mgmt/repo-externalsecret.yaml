# Argo CD's read-only GitHub token for core1-gitops, delivered from OpenBao (core1/mgmt/github).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-core1-gitops
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: core1
spec:
  refreshInterval: 5m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: repo-core1-gitops
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
          app.kubernetes.io/part-of: core1
      data:
        type: git
        url: __CORE1_GITOPS_URL__
        username: core1-argocd
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef: {key: mgmt/github, property: argocd_token}
