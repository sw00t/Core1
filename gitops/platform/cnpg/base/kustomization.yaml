# CloudNativePG operator: Postgres as a managed service in every cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system
resources:
  - namespace.yaml
helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1  # operator 1.30.1
    releaseName: cnpg
    namespace: cnpg-system
    includeCRDs: true
    valuesFile: values.yaml
