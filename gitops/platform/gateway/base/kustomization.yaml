# Envoy Gateway (Gateway API controller) plus the shared GatewayClass. Each overlay adds its cluster's Gateway.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - gatewayclass.yaml
helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.9.2
    releaseName: eg
    namespace: envoy-gateway-system
    includeCRDs: true
    valuesFile: values.yaml
