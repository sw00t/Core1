# Keycloak 26.7.5 on a CloudNativePG Postgres. Realm "core1" is re-imported from realm.json on every start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - namespace.yaml
  - database.yaml
  - externalsecret.yaml
  - deployment.yaml
  - httproute.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      # `kc.sh import --dir` only reads files named <realm>-realm.json
      - core1-realm.json=realm.json
generatorOptions:
  labels:
    app.kubernetes.io/part-of: core1
