# Keycloak at https://sso.mgmt.localhost:<mgmt https port>
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: core1
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: core1, namespace: gateway, sectionName: https}]
  hostnames: ["sso.mgmt.localhost"]
  rules:
    # defaults written out so Argo CD's diff matches what the API server stores
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: keycloak, port: 8080, weight: 1}]
