apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: core1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: core1
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Realm as code: re-import realm.json on every start, replacing what is there. A change to the
        # realm file rolls this pod (the ConfigMap name carries a content hash).
        - name: import-realm
          image: quay.io/keycloak/keycloak:26.7.5
          args: ["import", "--dir", "/opt/keycloak/data/import", "--override", "true"]
          env:
            - {name: KC_HOSTNAME, value: "https://sso.mgmt.localhost:__CORE1_MGMT_HTTPS_PORT__"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "true"}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://keycloak-db-rw:5432/keycloak"}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-db-app, key: username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db-app, key: password}}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: admin_password}}
            # read by realm.json placeholders
            - name: ARGOCD_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: argocd_client_secret}}
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: platform_admin_password}}
            - name: PLATFORM_VIEWER_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: platform_viewer_password}}
            - {name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=30"}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.5
          args: ["start"]
          env:
            - {name: KC_HOSTNAME, value: "https://sso.mgmt.localhost:__CORE1_MGMT_HTTPS_PORT__"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "true"}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://keycloak-db-rw:5432/keycloak"}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-db-app, key: username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db-app, key: password}}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: admin_password}}
            # read by realm.json placeholders
            - name: ARGOCD_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: argocd_client_secret}}
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: platform_admin_password}}
            - name: PLATFORM_VIEWER_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: platform_viewer_password}}
            - {name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=30"}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: core1
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - {name: http, port: 8080, targetPort: http}
