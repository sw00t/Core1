# Generated by `core1 up` into OpenBao (core1/mgmt/keycloak); never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: core1
spec:
  refreshInterval: 5m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  dataFrom:
    - extract: {key: mgmt/keycloak}
