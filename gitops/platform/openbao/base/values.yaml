# OpenBao 2.6.4, single node, integrated (raft) storage. TLS ends at the gateway; in-cluster traffic is plain HTTP.
injector:
  enabled: false  # External Secrets delivers secrets, not the agent injector
server:
  image:
    tag: "2.6.4"
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  dataStorage:
    enabled: true
    size: 1Gi
  authDelegator:
    enabled: true  # lets OpenBao review mgmt ServiceAccount tokens
  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "raft" {
        path = "/openbao/data"
        node_id = "openbao-0"
      }
      api_addr = "http://openbao.openbao.svc:8200"
      cluster_addr = "http://openbao-0.openbao-internal:8201"
ui:
  enabled: false  # served through the gateway route instead of its own Service
