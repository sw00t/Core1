# OpenBao UI and API at https://bao.mgmt.localhost:<mgmt https port>. stage and prod External Secrets use it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: openbao
  labels:
    app.kubernetes.io/part-of: core1
spec:
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: core1, namespace: gateway, sectionName: https}]
  hostnames: ["bao.mgmt.localhost"]
  rules:
    # defaults written out so Argo CD's diff matches what the API server stores
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: openbao, port: 8200, weight: 1}]
