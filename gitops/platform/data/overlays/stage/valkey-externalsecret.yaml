# Valkey password for stage, generated by core1 up into OpenBao (core1/stage/valkey).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey
  namespace: data
  labels:
    app.kubernetes.io/part-of: core1
spec:
  refreshInterval: 5m
  secretStoreRef: {kind: ClusterSecretStore, name: openbao}
  target:
    name: valkey
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: {key: stage/valkey, property: password}
