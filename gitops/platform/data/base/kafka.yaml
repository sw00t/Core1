# Apache Kafka 4.3.1 in KRaft mode: one node acting as controller and broker. Plain internal listener
# (lab trade-off; no TLS or auth inside the cluster).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    app.kubernetes.io/part-of: core1
    strimzi.io/cluster: events
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: true
  resources:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {memory: 1Gi}
  jvmOptions:
    "-Xms": 384m
    "-Xmx": 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: events
  labels:
    app.kubernetes.io/part-of: core1
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
