# Strimzi operator (Apache Kafka on Kubernetes), watching the data namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
helmCharts:
  - name: strimzi-kafka-operator
    repo: oci://quay.io/strimzi-helm
    version: 1.2.0
    releaseName: strimzi
    namespace: strimzi-system
    includeCRDs: true
    valuesFile: values.yaml
