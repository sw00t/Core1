# Test pods for `kyverno test`. "good" passes every rule; each "bad-*" breaks exactly one.
apiVersion: v1
kind: Pod
metadata: {name: good, namespace: demo, labels: {app.kubernetes.io/part-of: demo}}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: k3d-registry:17000/demo/app:1.0.0
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-no-limits, namespace: demo, labels: {app.kubernetes.io/part-of: demo}}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - {name: app, image: "k3d-registry:17000/demo/app:1.0.0"}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-latest, namespace: demo, labels: {app.kubernetes.io/part-of: demo}}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: nginx:latest
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-untagged, namespace: demo, labels: {app.kubernetes.io/part-of: demo}}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: nginx
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-privileged, namespace: demo, labels: {app.kubernetes.io/part-of: demo}}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: k3d-registry:17000/demo/app:1.0.0
      securityContext: {privileged: true}
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-hostpath, namespace: demo, labels: {app.kubernetes.io/part-of: demo}}
spec:
  securityContext: {runAsNonRoot: true}
  volumes: [{name: host, hostPath: {path: /etc}}]
  containers:
    - name: app
      image: k3d-registry:17000/demo/app:1.0.0
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-root, namespace: demo, labels: {app.kubernetes.io/part-of: demo}}
spec:
  containers:
    - name: app
      image: k3d-registry:17000/demo/app:1.0.0
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-no-label, namespace: demo}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: k3d-registry:17000/demo/app:1.0.0
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
# Platform namespaces are excluded, so this passes despite breaking every rule.
apiVersion: v1
kind: Pod
metadata: {name: platform-exempt, namespace: kube-system}
spec:
  containers:
    - {name: app, image: nginx:latest}
