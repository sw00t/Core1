apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: core1-app
resources:
  - ../../base

images:
  - name: core1.local/gateway
    newTag: 1.0.0
  - name: core1.local/orders
    newTag: 1.0.0
  - name: core1.local/inventory
    newTag: 1.0.0

replicas:
  - name: gateway
    count: 2
  - name: orders
    count: 2
  - name: inventory
    count: 2

configMapGenerator:
  - name: gateway-config
    envs: [config/gateway.env]
  - name: orders-config
    envs: [config/orders.env]
  - name: inventory-config
    envs: [config/inventory.env]

patches:
  - path: patches/gateway-resources.yaml
  - path: patches/orders-resources.yaml
  - path: patches/inventory-resources.yaml
