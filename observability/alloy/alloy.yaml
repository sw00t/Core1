# Grafana Alloy as a single-replica Deployment that tails every pod's logs through the Kubernetes
# API (no host paths) and ships them to Loki. Labels kept: namespace, pod, container, app.apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: core1}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: core1-alloy
  labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: core1}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core1-alloy
  labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: core1}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: core1-alloy}
subjects:
  - {kind: ServiceAccount, name: alloy, namespace: core1-observability}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: core1}
data:
  config.alloy: |
    logging {
      level = "warn"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.core1-observability.svc:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: core1}
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: http
      port: 12345
      targetPort: 12345
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: core1}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: alloy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: core1}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: __ALLOY_IMAGE__
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
            - --disable-reporting
          ports:
            - {name: http, containerPort: 12345}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
            - {name: data, mountPath: /var/lib/alloy/data}
      volumes:
        - name: config
          configMap: {name: alloy-config}
        - name: data
          emptyDir: {}
