# Provisioned through the Grafana sidecar (label grafana_dashboard=1). Generated by scripts/gen_dashboard.py; edit that, not this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: core1-dashboard-services
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: core1
data:
  core1-services.json: |
    {
      "uid": "core1-services",
      "title": "Cascadia Mobile / Activation platform",
      "tags": [
        "core1",
        "cascadia"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "editable": true,
      "panels": [
        {
          "type": "row",
          "title": "Activations (the business metric the NOC watches)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": [],
          "id": 1
        },
        {
          "type": "stat",
          "title": "Activations per minute",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cascadia:activations_per_min"
            }
          ],
          "description": "SIM activation orders completing at the gateway, per minute, over a 2m window.",
          "id": 2
        },
        {
          "type": "stat",
          "title": "Failed activations per minute",
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cascadia:failed_activations_per_min"
            }
          ],
          "description": "Activation orders that returned 5xx at the gateway. Severity is derived from the ratio of these two.",
          "id": 3
        },
        {
          "type": "stat",
          "title": "Failure ratio",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cascadia:failed_activations_per_min / cascadia:activations_per_min"
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Pods not ready",
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_ready{namespace=\"core1-app\", condition=\"false\"}) or vector(0)"
            }
          ],
          "id": 5
        },
        {
          "type": "timeseries",
          "title": "Activations vs failures per minute",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cascadia:activations_per_min",
              "legendFormat": "activations"
            },
            {
              "refId": "B",
              "expr": "cascadia:failed_activations_per_min",
              "legendFormat": "failed"
            }
          ],
          "id": 6
        },
        {
          "type": "row",
          "title": "Activation path: gateway, orders, inventory",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": [],
          "id": 7
        },
        {
          "type": "timeseries",
          "title": "Request rate by service",
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(http_requests_total{namespace=\"core1-app\"}[1m]))",
              "legendFormat": "{{service}}"
            }
          ],
          "id": 8
        },
        {
          "type": "timeseries",
          "title": "5xx ratio by service",
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(http_requests_total{namespace=\"core1-app\", status=~\"5..\"}[1m])) / sum by (service) (rate(http_requests_total{namespace=\"core1-app\"}[1m]))",
              "legendFormat": "{{service}}"
            }
          ],
          "id": 9
        },
        {
          "type": "timeseries",
          "title": "p95 latency by service",
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{namespace=\"core1-app\"}[1m])))",
              "legendFormat": "{{service}}"
            }
          ],
          "id": 10
        },
        {
          "type": "timeseries",
          "title": "Upstream call outcomes",
          "gridPos": {
            "x": 12,
            "y": 23,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service, upstream, outcome) (rate(upstream_requests_total{namespace=\"core1-app\"}[1m]))",
              "legendFormat": "{{service}} -> {{upstream}} {{outcome}}"
            }
          ],
          "id": 11
        },
        {
          "type": "row",
          "title": "Order store (Postgres) and workloads",
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": [],
          "id": 12
        },
        {
          "type": "timeseries",
          "title": "Orders DB pool: connections in use vs max per pod",
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (db_pool_connections_in_use{namespace=\"core1-app\"})",
              "legendFormat": "{{pod}} in use"
            },
            {
              "refId": "B",
              "expr": "max(db_pool_max_connections{namespace=\"core1-app\"})",
              "legendFormat": "max per pod"
            }
          ],
          "id": 13
        },
        {
          "type": "timeseries",
          "title": "DB pool acquire timeouts per second",
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(db_pool_acquire_timeouts_total{namespace=\"core1-app\"}[1m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 14
        },
        {
          "type": "timeseries",
          "title": "Container restarts (5m)",
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"core1-app\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "id": 15
        },
        {
          "type": "timeseries",
          "title": "Deployment replicas: available vs desired",
          "gridPos": {
            "x": 12,
            "y": 40,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"core1-app\"}",
              "legendFormat": "{{deployment}} available"
            },
            {
              "refId": "B",
              "expr": "kube_deployment_spec_replicas{namespace=\"core1-app\"}",
              "legendFormat": "{{deployment}} desired"
            }
          ],
          "id": 16
        },
        {
          "type": "row",
          "title": "Changes and errors",
          "gridPos": {
            "x": 0,
            "y": 48,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": [],
          "id": 17
        },
        {
          "type": "logs",
          "title": "Deploy events (every change that reached the cluster)",
          "gridPos": {
            "x": 0,
            "y": 49,
            "w": 24,
            "h": 7
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{job=\"deploy-events\"}"
            }
          ],
          "id": 18
        },
        {
          "type": "logs",
          "title": "Service errors (5xx and upstream failures)",
          "gridPos": {
            "x": 0,
            "y": 56,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"core1-app\"} |= \"\\\"level\\\": \\\"error\\\"\""
            }
          ],
          "id": 19
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "name": "Deploys",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "enable": true,
            "expr": "{job=\"deploy-events\"}",
            "iconColor": "blue",
            "titleFormat": "deploy"
          }
        ]
      }
    }
