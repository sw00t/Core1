# NodePort services the host port mappings in scripts/cluster-up.sh point at.
# Selecting by pod labels keeps this independent of chart service naming.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  labels: {app.kubernetes.io/part-of: core1}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-nodeport
  labels: {app.kubernetes.io/part-of: core1}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      nodePort: 30093
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  labels: {app.kubernetes.io/part-of: core1}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
