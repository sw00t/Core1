# Read-only identity for the agent. Can observe workloads, pods, logs, events and config across the
# cluster. Cannot read secrets, cannot exec, cannot change anything. Changes go through the config repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-readonly
  namespace: core1-system
  labels: {app.kubernetes.io/part-of: core1}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: core1-agent-readonly
  labels: {app.kubernetes.io/part-of: core1}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "services", "endpoints", "configmaps", "events",
                "namespaces", "nodes", "nodes/status", "persistentvolumeclaims", "replicationcontrollers",
                "resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "servicemonitors", "podmonitors", "alertmanagerconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core1-agent-readonly
  labels: {app.kubernetes.io/part-of: core1}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: core1-agent-readonly}
subjects:
  - {kind: ServiceAccount, name: agent-readonly, namespace: core1-system}
